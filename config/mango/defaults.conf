# fedora-noctalia-setup defaults for MangoWC. Sourced by ~/.config/mango/config.conf, which comes after this file, so
# what you set there wins. Check with `mango -c ~/.config/mango/config.conf -p`.
# Reference: https://mangowm.github.io/docs/configuration

# Session: Noctalia (bar, launcher, notifications, lock screen) and USB drive mounting.
exec_once=noctalia
exec_once=udiskie --no-notify --no-tray
# Qt and KDE apps read Noctalia's colors, Breeze, Papirus and the fonts from kdeglobals (plasma-integration).
env=QT_QPA_PLATFORMTHEME,kde
env=XDG_MENU_PREFIX,plasma-
env=ELECTRON_OZONE_PLATFORM_HINT,auto
env=TERMINAL,xdg-terminal-exec
cursor_theme=Classic-pointer
cursor_size=32

# Look. Border colors come from Noctalia's mango template (noctalia.conf). Noctalia's panels animate themselves.
layer_animations=0
border_px=2
border_radius=14
gap_inner_horizontal=5
gap_inner_vertical=5
gap_outer_horizontal=10
gap_outer_vertical=10
blur=1
blur_layer=1
blur_optimized=1
blur_params_num_passes=2
blur_params_radius=5
blur_params_noise=0.02
blur_params_brightness=0.9
blur_params_contrast=0.9
blur_params_saturation=1.0
shadows=1
layer_shadows=1
shadow_only_floating=0
shadows_size=4
shadows_blur=12
shadows_position_x=2
shadows_position_y=2
shadows_color=0x000000ff
# No blur behind Noctalia's wallpaper.
layer_rule=no_blur:1,no_shadow:1,layer_name:^noctalia-(wallpaper|backdrop)

# Input
numlock_on=1
sloppy_focus=1
tap_to_click=1
trackpad_natural_scrolling=1
mouse_natural_scrolling=1

# Five desks (tags), master and stack like the other compositors.
tag_num=9
tag_rule=id:1,layout_name:tile
tag_rule=id:2,layout_name:tile
tag_rule=id:3,layout_name:tile
tag_rule=id:4,layout_name:tile
tag_rule=id:5,layout_name:tile

window_rule=is_floating:1,width:1080,height:920,app_id:^dev.noctalia.Noctalia$
window_rule=is_floating:1,app_id:^(org.kde.kcalc|nm-connection-editor|system-config-printer)$

# The standard keybindings come from ~/.config/mango/keybinds.conf (written from config/keybinds.tsv and your changes;
# see `keybinds`). These are MangoWC's own extras: mouse and gestures.
source_optional=~/.config/mango/keybinds.conf
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize

# Three-finger swipes switch desks.
gesturebind=none,left,3,viewtoright,0
gesturebind=none,right,3,viewtoleft,0
