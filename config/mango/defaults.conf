# fedora-noctalia-setup defaults for MangoWC. Sourced by ~/.config/mango/config.conf, which comes after this file, so
# what you set there wins. Check with `mango -c ~/.config/mango/config.conf -p`.
# Reference: https://mangowm.github.io/docs/configuration

# Session: Noctalia (bar, launcher, notifications, lock screen) and USB drive mounting.
exec_once=noctalia
exec_once=udiskie --no-notify --no-tray
# Qt and KDE apps read Noctalia's colors, Breeze, Papirus and the fonts from kdeglobals (plasma-integration).
env=QT_QPA_PLATFORMTHEME,kde
env=XDG_MENU_PREFIX,plasma-
env=ELECTRON_OZONE_PLATFORM_HINT,auto
env=TERMINAL,xdg-terminal-exec
cursor_theme=Classic-pointer
cursor_size=32

# Look. Border colors come from Noctalia's mango template (noctalia.conf). Noctalia's panels animate themselves.
layer_animations=0
border_px=2
border_radius=14
gap_inner_horizontal=5
gap_inner_vertical=5
gap_outer_horizontal=10
gap_outer_vertical=10
blur=1
blur_layer=1
blur_optimized=1
blur_params_num_passes=2
blur_params_radius=5
blur_params_noise=0.02
blur_params_brightness=0.9
blur_params_contrast=0.9
blur_params_saturation=1.0
shadows=1
layer_shadows=1
shadow_only_floating=0
shadows_size=4
shadows_blur=12
shadows_position_x=2
shadows_position_y=2
shadows_color=0x000000ff
# No blur behind Noctalia's wallpaper.
layer_rule=no_blur:1,no_shadow:1,layer_name:^noctalia-(wallpaper|backdrop)

# Input
numlock_on=1
sloppy_focus=1
tap_to_click=1
trackpad_natural_scrolling=1
mouse_natural_scrolling=1

# Five desks (tags), master and stack like the other compositors.
tag_num=9
tag_rule=id:1,layout_name:tile
tag_rule=id:2,layout_name:tile
tag_rule=id:3,layout_name:tile
tag_rule=id:4,layout_name:tile
tag_rule=id:5,layout_name:tile

window_rule=is_floating:1,width:1080,height:920,app_id:^dev.noctalia.Noctalia$
window_rule=is_floating:1,app_id:^(org.kde.kcalc|nm-connection-editor|system-config-printer)$

# Windows
bind=SUPER,q,killclient
bind=SUPER,f,togglefullscreen
bind=SUPER,d,togglemaximizescreen
bind=SUPER+ALT,space,togglefloating
bind=SUPER,Left,focusdir,left
bind=SUPER,Right,focusdir,right
bind=SUPER,Up,focusdir,up
bind=SUPER,Down,focusdir,down
bind=SUPER+SHIFT,Left,exchange_client,left
bind=SUPER+SHIFT,Right,exchange_client,right
bind=SUPER+SHIFT,Up,exchange_client,up
bind=SUPER+SHIFT,Down,exchange_client,down
bind=ALT,Tab,focusstack,next
bind=SUPER,o,toggleoverview
bind=SUPER,s,toggle_scratchpad
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize

# Desks: Super+N shows desk N, Super+Shift+N moves the window there.
bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER+SHIFT,1,tag,1,0
bind=SUPER+SHIFT,2,tag,2,0
bind=SUPER+SHIFT,3,tag,3,0
bind=SUPER+SHIFT,4,tag,4,0
bind=SUPER+SHIFT,5,tag,5,0
bind=CTRL+SUPER,Left,viewtoleft,0
bind=CTRL+SUPER,Right,viewtoright,0

# Apps: the defaults chosen in the installer (or later with xdg-mime).
bind=SUPER,Return,spawn,xdg-terminal-exec
bind=SUPER,e,spawn,open-default files
bind=SUPER,w,spawn,open-default browser
bind=SUPER,t,spawn,open-default editor
bind=SUPER,c,spawn,kcalc
bind=NONE,XF86Calculator,spawn,kcalc
bind=CTRL+SHIFT,Escape,spawn,xdg-terminal-exec btop

# Noctalia
bind=SUPER,space,spawn,noctalia msg panel-toggle launcher
bind=SUPER,period,spawn,noctalia msg panel-toggle launcher /emo
bind=SUPER,x,spawn,noctalia msg panel-toggle control-center
bind=SUPER,z,spawn,noctalia msg settings-toggle
bind=SUPER,a,spawn,noctalia msg panel-toggle control-center notifications
bind=SUPER,v,spawn,noctalia msg panel-toggle clipboard
bind=SUPER,l,spawn,noctalia msg session lock
bind=SUPER+ALT,c,spawn,noctalia msg panel-toggle session
bind=SUPER+SHIFT,w,spawn,noctalia msg panel-toggle wallpaper
bind=SUPER,Tab,spawn,noctalia msg window-switcher
bind=NONE,Print,spawn,noctalia msg screenshot-region
bind=SUPER,Print,spawn,noctalia msg screenshot-fullscreen
bind=SUPER+SHIFT,s,spawn,noctalia msg plugin noctalia/screen_recorder:service all toggle

# Hardware keys (also on the lock screen)
bindl=NONE,XF86AudioRaiseVolume,spawn,noctalia msg volume-up
bindl=NONE,XF86AudioLowerVolume,spawn,noctalia msg volume-down
bindl=NONE,XF86AudioMute,spawn,noctalia msg volume-mute
bindl=NONE,XF86AudioMicMute,spawn,noctalia msg mic-mute
bindl=NONE,XF86AudioPlay,spawn,noctalia msg media toggle
bindl=NONE,XF86AudioNext,spawn,noctalia msg media next
bindl=NONE,XF86AudioPrev,spawn,noctalia msg media previous
bindl=NONE,XF86MonBrightnessUp,spawn,noctalia msg brightness-up
bindl=NONE,XF86MonBrightnessDown,spawn,noctalia msg brightness-down

# Three-finger swipes switch desks.
gesturebind=none,left,3,viewtoright,0
gesturebind=none,right,3,viewtoleft,0
