# Portals for niri. Like the package's niri-portals.conf (GNOME's portal for screen sharing, GTK's for the rest), but
# passwords in gnome-keyring and file dialogs from Luciole (GTK's if it is missing), so Nautilus isn't needed.
[preferred]
default=gnome;gtk
org.freedesktop.impl.portal.Access=gtk
org.freedesktop.impl.portal.Notification=gtk
org.freedesktop.impl.portal.Secret=gnome-keyring
org.freedesktop.impl.portal.FileChooser=luciole;gtk
