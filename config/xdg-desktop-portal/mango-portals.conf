# Portals for MangoWC, as its docs recommend: wlr for screen sharing and screenshots, GTK for the rest, passwords in
# gnome-keyring, file dialogs from Luciole (GTK's if it is missing).
[preferred]
default=gtk
org.freedesktop.impl.portal.ScreenCast=wlr
org.freedesktop.impl.portal.Screenshot=wlr
org.freedesktop.impl.portal.Secret=gnome-keyring
org.freedesktop.impl.portal.FileChooser=luciole;gtk
org.freedesktop.impl.portal.Inhibit=none
