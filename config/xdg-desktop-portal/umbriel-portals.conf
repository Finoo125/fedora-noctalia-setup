# Portals for Umbriel. Like the package's /usr/share/xdg-desktop-portal/umbriel-portals.conf, plus a Secret portal:
# without it Flatpaks can't keep passwords in gnome-keyring.
# File dialogs come from Luciole (in the desktop's colors, started on demand), GTK's if it is missing.
[preferred]
default=umbriel;gtk
org.freedesktop.impl.portal.Secret=gnome-keyring
org.freedesktop.impl.portal.FileChooser=luciole;gtk
