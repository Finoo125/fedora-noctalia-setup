# fedora-noctalia-setup defaults for Umbriel. Included by ~/.config/umbriel/config.toml, which is applied after this
# file, so what you set there wins: tables merge key by key, but a list (like general.autostart) replaces this one.
# Reloads on save; check with `umbriel config validate`. Reference: https://docs.noctalia.dev/umbriel/
#
# Next to your config.toml:
#   monitors.toml    your monitor layout, written by `monitors` (Umbriel matches monitors by make+model+serial)
#   noctalia.toml    border and overview colors from Noctalia's umbriel template
#   scripts/         a link to this repo's desks (five linked desks)

# The standard keybindings (written from config/keybinds.tsv and your changes; see `keybinds`).
[include.optional]
files = ["~/.config/umbriel/keybinds.toml"]

# ==============================================================================
# Session

[general]
# XDG autostart entries (KDE Connect etc.) run on their own: umbriel-session.target pulls in xdg-desktop-autostart.target.
autostart = [
  "noctalia",
  "udiskie --no-notify --no-tray",
  "dock-watch",
]
# X11 apps (Steam, some games) draw at full resolution on a scaled panel (xwayland.force_zero_scaling).
xwayland_native_resolution = true

# For Umbriel and everything it starts; also published to the systemd user manager (Noctalia, portals).
# XCURSOR_* is set from [input.cursor] below.
[environment]
# Qt and KDE apps read Noctalia's KDE color scheme, Breeze, Papirus and the fonts from kdeglobals (plasma-integration).
QT_QPA_PLATFORMTHEME = "kde"
# KDE apps find the app menu (Dolphin's "Open with") in Plasma's menu file, outside Plasma too.
XDG_MENU_PREFIX = "plasma-"
ELECTRON_OZONE_PLATFORM_HINT = "auto"
# The default terminal (xdg-terminals.list, set by the installer).
TERMINAL = "xdg-terminal-exec"

# ==============================================================================
# Laptop panel. Your monitor layout from `monitors` is in monitors.toml.

[output.eDP-1]
scale = 1
workspaces = 5
workspace_axis = "horizontal"   # three-finger swipe left/right changes desk, like hl.gesture

# ==============================================================================
# Look

[appearance]
prefer_no_csd = true
border_width = 2
corner_radius = 14

[appearance.shadow]
enabled = true

[appearance.blur]
enabled = true
radius = 3

[layout]
mode = "master"
gap = 10                 # gaps_in 5 + gaps_in 5 between windows, gaps_out 10 at the edges

# One window left, the rest stacked on the right; new windows join the stack at the bottom.
[layout.master]
position = "left"
default_width_fraction = 0.5
new_on_top = false
new_becomes_master = false

# Noctalia's own panels animate themselves.
[animation.layers]
enabled = false

[workspaces]
back_and_forth = false

# ==============================================================================
# Input. An empty keyboard layout uses the system keymap from localectl (install.sh asks for it).

[input.keyboard]
layout = ""
numlock_toggle = true

[input.focus]
follows_mouse = "sloppy"   # follow_mouse = 1

[input.touchpad]
tap = true
natural_scroll = true

[input.mouse]
natural_scroll = true

[input.cursor]
theme = "Classic-pointer"
size = 32

# ==============================================================================
# Keybinds. This table replaces Umbriel's built-in set.
# Super+drag moves a window and Super+right-drag resizes it; both are built in.

[keybinds]
# The standard keybindings come from ~/.config/umbriel/keybinds.toml (written from config/keybinds.tsv and your
# changes; see `keybinds`). These are Umbriel's own extras.
"Mod+J" = "window-swap-left"   # from the stack this swaps with the master window
"Mod+Alt+1" = "output-focus-left"    # portrait monitor
"Mod+Alt+2" = "output-focus-right"   # main monitor
"Mod+Ctrl+S" = { action = "window-toggle-scratchpad", repeat = false }
"Mod+Shift+Escape" = { action = "shortcuts-inhibit-toggle", allow_when_inhibited = true, repeat = false }

# ==============================================================================
# Window rules

# Blur behind translucent windows (Ghostty).
[[window_rule]]
blur = true

[[window_rule]]
match.app_id = "^dev.noctalia.Noctalia$"
default_floating = true
default_floating_size_px = { width = 1080, height = 920 }

[[window_rule]]
match.app_id = "^(org.kde.kcalc|nm-connection-editor|system-config-printer)$"
default_floating = true

[[window_rule]]
match.app_id = "^dev.noctalia.UmbrielSharePicker$"
default_floating = true
default_floating_size_px = { width = 800, height = 600 }

[[window_rule]]
match.title = "^(Picture-in-Picture|Picture in picture)$"
default_floating = true
default_maximize = false
default_position = { x = 20, y = 20, anchor = "bottom_right" }

# ==============================================================================
# Layer rules

[[layer_rule]]
match.namespace = "^noctalia-(bar-[^\"]+|notification|dock|panel|attached-panel|osd|window-switcher|desktop-widget-[^\"]*)$"
blur = true
blur_ignore_alpha = 0.5
blur_popups = true

[[layer_rule]]
match.namespace = "^noctalia-(notification|dock|panel|attached-panel|osd|window-switcher)$"
blur_optimized = false
