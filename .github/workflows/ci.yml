name: ci
on: [push, pull_request]
jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: shellcheck
        run: shellcheck install.sh bin/* lib/*.sh tests/*.sh config/umbriel/scripts/*.sh
      - name: bash unit tests
        run: bash tests/run.sh
  packages:
    runs-on: ubuntu-latest
    container: fedora:45
    steps:
      - uses: actions/checkout@v4
      - name: Every package and Flatpak exists
        run: bash tests/repoquery.sh
      - name: No package pulls in another desktop
        run: bash tests/no_foreign_desktop.sh
  compositors:
    runs-on: ubuntu-latest
    container: fedora:45
    steps:
      - uses: actions/checkout@v4
      - name: Every compositor accepts its config
        run: bash tests/compositors.sh
